<!-- Hidden element used by Google Translate -->
<div id="google_translate_element_init" style="display:none"></div>

<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: "en",
        includedLanguages:
          "en,hi,bn,mr,gu,ta,te,kn,ml,bho", /* same list as dropdown */
        autoDisplay: false,
      },
      "google_translate_element_init"
    );
  }
</script>
